version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: collab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-collab_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-collab_user} -d ${POSTGRES_DB:-collab_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collab_network

  # ── NestJS API ──────────────────────────────────────────────────────────────
  # Only used when running the full stack in Docker (production-like).
  # For local development, run `pnpm --filter @collab/api dev` instead.
  api:
    build:
      context: ..                      # monorepo root (for pnpm workspace)
      dockerfile: apps/api/Dockerfile
    container_name: collab_api
    restart: unless-stopped
    env_file:
      - ../.env                        # reads DATABASE_URL, JWT secrets, etc.
    environment:
      # Override DATABASE_URL host to use Docker service name instead of localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-collab_user}:${POSTGRES_PASSWORD:-collab_secret}@postgres:5432/${POSTGRES_DB:-collab_db}?schema=public
      NODE_ENV: production
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy     # waits until Postgres passes health check
    networks:
      - collab_network
    profiles:
      - fullstack                      # only starts with: docker compose --profile fullstack up

  # ── pgAdmin (optional dev tool) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: collab_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@collab.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - collab_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  collab_network:
    driver: bridge
