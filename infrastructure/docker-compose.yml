version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-collab_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-collab_user} -d ${POSTGRES_DB:-collab_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collab_network

  # ── Future services will be added here ──────────────────────────────────────
  # redis:
  #   image: redis:7-alpine
  #   ...
  # pgadmin (optional dev tool):
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: collab_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@collab.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - collab_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  collab_network:
    driver: bridge
